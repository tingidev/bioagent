services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bioagent
      POSTGRES_PASSWORD: bioagent
      POSTGRES_DB: bioagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioagent"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bioagent:bioagent@db:5432/bioagent
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: .
    command: python -m bioagent.ingest
    environment:
      DATABASE_URL: postgresql://bioagent:bioagent@db:5432/bioagent
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
