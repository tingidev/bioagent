[project]
name = "bioagent"
version = "0.1.0"
description = "Agentic investigator across scientific databases"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "asyncpg>=0.30.0",
    "sse-starlette>=2.2.0",
    "anthropic[bedrock]>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioagent"]

[tool.ruff]
target-version = "py312"
line-length = 100
